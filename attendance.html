<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;transition:.3s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:16px;font-weight:800} .top h1 span{color:var(--primary)}
.badge{font-size:9px;background:var(--bg-soft);border:1px solid var(--card-border);padding:5px 10px;border-radius:99px;color:var(--text-soft)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;background:var(--bg-soft);border:1px solid var(--card-border);color:var(--text);padding:11px;border-radius:10px;margin:6px 0;font-size:13px;outline:none}
button{width:100%;background:var(--hero);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px} .stat span{font-size:8px;color:var(--text-soft)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--card-border)}
th{font-size:9px;background:var(--bg-soft);padding:10px;color:var(--text-soft)} td{font-size:11px;padding:10px;text-align:center;border-top:1px solid var(--bg-soft)}
.hader{color:var(--primary);font-weight:800} .ghaeb{color:#ef4444;font-weight:800}
.del{width:auto;background:#fee2e2;color:#dc2626;padding:4px 8px;font-size:9px;border-radius:6px;border:1px solid #fecaca;cursor:pointer}
</style>
</head>
<body>
<div class="top"><h1>⏱️ <span>الحضور</span></h1><div class="badge" id="st">⏳ جاري الاتصال...</div></div>

<div class="grid">
<div class="stat"><b id="cAll">0</b><span>الكل</span></div>
<div class="stat"><b id="cH" style="color:var(--primary)">0</b><span>حاضر</span></div>
<div class="stat"><b id="cG" style="color:#ef4444">0</b><span>غائب</span></div>
</div>

<div class="card">
<input id="name" placeholder="اسم الطالب / الموظف">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<select id="statusSel"><option value="حاضر">حاضر ✅</option><option value="غائب">غائب ❌</option><option value="متأخر">متأخر ⏰</option></select>
<input type="date" id="date">
</div>
<button onclick="addAtt()">تسجيل الحضور +</button>
</div>

<table id="tbl"><thead><tr><th>الاسم</th><th>الحالة</th><th>التاريخ</th><th>❌</th></tr></thead><tbody></tbody></table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFY2u5XCwowJ2_kiOZoH8n52RgwoSLuog",
  authDomain: "omar-project-32c66.firebaseapp.com",
  projectId: "omar-project-32c66",
  storageBucket: "omar-project-32c66.firebasestorage.app",
  messagingSenderId: "565578222991",
  appId: "1:565578222991:web:19231bf26995849d874ffa",
  measurementId: "G-9DWP9EZHRF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "attendance");

document.getElementById("date").valueAsDate = new Date();
document.getElementById("st").innerText = "✅ متصل - محفوظ Online";

window.addAtt = async ()=>{
  const name=document.getElementById("name").value.trim();
  const status=document.getElementById("statusSel").value;
  const date=document.getElementById("date").value;
  if(!name) return alert("اكتب الاسم");
  await addDoc(colRef, { name, status, date, createdAt: serverTimestamp(), owner:"omar" });
  document.getElementById("name").value="";
}

onSnapshot(query(colRef, orderBy("createdAt","desc")), (snap)=>{
  const tb=document.querySelector("#tbl tbody");
  tb.innerHTML="";
  let all=0,h=0,g=0;
  snap.forEach(d=>{
    const r=d.data(); all++; if(r.status==='حاضر') h++; if(r.status==='غائب') g++;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.name}</td><td class="${r.status==='حاضر'?'hader':'ghaeb'}">${r.status}</td><td>${r.date}</td><td><button class="del" onclick="delAtt('${d.id}')">حذف</button></td>`;
    tb.appendChild(tr);
  });
  document.getElementById("cAll").innerText=all;
  document.getElementById("cH").innerText=h;
  document.getElementById("cG").innerText=g;
  if(all===0) tb.innerHTML=`<tr><td colspan="4" style="color:var(--text-soft);padding:20px">لا يوجد حضور مسجل</td></tr>`;
});

window.delAtt = async (id)=>{ if(confirm("حذف السجل؟")) await deleteDoc(doc(db,"attendance",id)); }
</script>
</body>
</html>
