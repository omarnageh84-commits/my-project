<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;transition:.3s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:16px;font-weight:800}
.top h1 span{color:var(--primary)}
.badge{font-size:9px;background:var(--bg-soft);border:1px solid var(--card-border);padding:5px 10px;border-radius:99px;color:var(--text-soft)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:10px}
input,textarea,select{width:100%;background:var(--bg-soft);border:1px solid var(--card-border);color:var(--text);padding:11px;border-radius:10px;margin:6px 0;font-size:13px;outline:none}
input:focus,textarea:focus{border-color:var(--primary)}
button{width:100%;background:var(--hero);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;transition:.2s}
button:active{transform:scale(.97)}
.entry{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:11px;margin:8px 0;border-right:4px solid var(--hero);animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.entry .date{font-size:8px;color:var(--text-soft)}.entry .ttl{font-size:12px;font-weight:800;margin:4px 0}.entry .txt{font-size:11px;line-height:1.6;color:var(--text)}
.del{width:auto;background:#fee2e2;color:#dc2626;padding:5px 12px;font-size:10px;margin-top:8px;border:1px solid #fecaca}
.status{text-align:center;font-size:10px;padding:8px;background:var(--bg-soft);border-radius:99px;margin-bottom:10px;border:1px solid var(--card-border)}
</style>
</head>
<body>
<div class="top"><h1>📓 <span>اليومية</span></h1><div class="badge" id="st">⏳ جاري الاتصال...</div></div>
<div class="card">
<input id="title" placeholder="عنوان اليومية (اختياري)">
<textarea id="content" rows="3" placeholder="اكتب اللي حصل النهاردة..."></textarea>
<button onclick="addDaily()">💾 حفظ في Firebase</button>
</div>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFY2u5XCwowJ2_kiOZoH8n52RgwoSLuog",
  authDomain: "omar-project-32c66.firebaseapp.com",
  projectId: "omar-project-32c66",
  storageBucket: "omar-project-32c66.firebasestorage.app",
  messagingSenderId: "565578222991",
  appId: "1:565578222991:web:19231bf26995849d874ffa",
  measurementId: "G-9DWP9EZHRF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "daily_reports");

document.getElementById("st").innerText = "✅ متصل - محفوظ Online";

window.addDaily = async ()=>{
  const title = document.getElementById("title").value.trim();
  const text = document.getElementById("content").value.trim();
  if(!text) return alert("اكتب اليومية");
  document.getElementById("st").innerText = "⏳ جاري الحفظ...";
  await addDoc(colRef, { title, text, date: new Date().toLocaleDateString('ar-EG'), createdAt: serverTimestamp(), owner:"omar" });
  document.getElementById("title").value=""; document.getElementById("content").value="";
  document.getElementById("st").innerText = "✅ تم الحفظ";
  setTimeout(()=>document.getElementById("st").innerText="✅ متصل - محفوظ Online",1000);
}

onSnapshot(query(colRef, orderBy("createdAt","desc")), (snap)=>{
  const list=document.getElementById("list");
  list.innerHTML="";
  if(snap.empty){ list.innerHTML=`<div style="text-align:center;color:var(--text-soft);font-size:11px;padding:20px">لا يوجد يوميات بعد - أول واحدة هتظهر هنا</div>`; return; }
  snap.forEach(d=>{
    const r=d.data();
    const div=document.createElement("div");
    div.className="entry";
    div.innerHTML=`<div class="date">${r.date||''}</div>${r.title?`<div class="ttl">${r.title}</div>`:''}<div class="txt">${r.text}</div><button class="del" onclick="delDaily('${d.id}')">حذف</button>`;
    list.appendChild(div);
  });
});

window.delDaily = async (id)=>{ if(confirm("حذف اليومية؟")) await deleteDoc(doc(db,"daily_reports",id)); }
</script>
</body>
</html>
