<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;font-family:'IBM Plex Sans Arabic',sans-serif}
body{margin:0;background:#fff;padding-bottom:70px}
.tabs{display:flex;gap:5px;padding:10px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #f0f0f0}
.tab{flex:1;padding:10px 4px;border-radius:999px;border:1px solid #e9eaec;background:#f7f7f8;color:#7a7e87;font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:#111;color:#fff}
.view{display:none}.view.active{display:block}
.save-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#111;color:#fff;font-size:14px;font-weight:800;margin-top:11px;position:sticky;bottom:0;z-index:5}
.media-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.media-btn{height:36px;border-radius:10px;border:1px solid #ececef;background:#f7f7f8;display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;font-weight:700;cursor:pointer}
</style>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw-fO9Xzi2jQhEm5Yy-wgVr4gNLW2wFu6uNquTcDN6ZsFdYOiMjv9E_QKwzyM5DXySDiQ/exec";
function syncToSheet(row){fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'add',sheet:'daily',row:row})});}
</script>
</head>
<body>
<!-- مفيش div class="phone" هنا - الفريم موجود في index.html بس -->
<div class="tabs"><button class="tab active">دخل</button><button class="tab">مصروف</button><button class="tab">ديون</button><button class="tab">أمانات</button><button class="tab">الإجمالي</button></div>
<div id="form-income-expense">
  <div class="media-row"><button class="media-btn">📷 كاميرا</button><button class="media-btn">🎤 صوت</button><button class="media-btn">📅 اليوم</button></div>
  <button class="save-btn">💾 حفظ العملية</button>
</div>
</body>
</html>
