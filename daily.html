<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'IBM Plex Sans Arabic',sans-serif}
body{margin:0;background:#f5f6f8;display:flex;justify-content:center;min-height:100vh}
.phone{width:390px;max-width:100%;background:#fff;border:8px solid #111;border-radius:28px;overflow:hidden;position:relative;min-height:80vh;display:flex;flex-direction:column}
.tabs{display:flex;gap:5px;padding:10px;background:#fff;border-bottom:1px solid #f0f0f0}
.tab{flex:1;padding:10px 4px;border-radius:999px;border:1px solid #e9eaec;background:#f7f7f8;color:#7a7e87;font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:#111;color:#fff;border-color:#111}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px}
.stat{background:#fafafa;border-radius:14px;padding:10px 4px;border:1px solid #f0f0f0;text-align:center}
.stat small{font-size:8px;color:#8b8f98;font-weight:600;display:block}
.stat b{font-size:13px;display:block;margin-top:2px}
.search{margin:0 10px;padding:10px 12px;border-radius:10px;border:1px solid #f0f0f0;background:#f7f7f8;width:calc(100% - 20px);font-size:11px;outline:none;text-align:right}
.empty{text-align:center;color:#9aa0aa;font-size:11px;margin-top:40px}
.fab{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:#111;color:#fff;border:none;font-size:26px;z-index:10;cursor:pointer}
/* Modal */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:end;justify-content:center;z-index:100}
.modal.active{display:flex}
.box{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:14px;max-height:92%;overflow:auto;padding-bottom:100px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{font-size:8px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px;text-align:right}
input,select{width:100%;padding:11px 8px;border-radius:10px;border:1px solid #ececef;background:#f7f7f8;font-size:11px;text-align:right;outline:none}
.footer{position:sticky;bottom:0;background:#fff;padding:12px 0 0 0;border-top:1px solid #f0f0f0;margin-top:10px}
.save{width:100%;padding:14px;border-radius:12px;border:none;background:#111;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.cancel{width:100%;padding:12px;border-radius:12px;border:none;background:#f5f5f4;color:#111;font-size:13px;font-weight:700;margin-top:8px;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:11px;transition:.3s;opacity:0;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="phone">
  <div class="tabs">
    <button class="tab active" data-type="دخل">دخل</button>
    <button class="tab" data-type="مصروف">مصروف</button>
    <button class="tab" data-type="دين">ديون</button>
    <button class="tab" data-type="أمانة">أمانات</button>
    <button class="tab" data-type="الإجمالي">الإجمالي</button>
  </div>
  <div class="stats"><div class="stat"><small>اليوم</small><b id="today">0</b></div><div class="stat"><small>الشهر</small><b id="month">0</b></div><div class="stat"><small>كاش</small><b id="cash">0</b></div></div>
  <input class="search" placeholder="...بحث">
  <div id="list" class="empty">لا يوجد - دوس + وضيف أول عملية</div>
  <button class="fab" onclick="openModal()">+</button>
  
  <div class="modal" id="modal">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button onclick="closeModal()" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#f7f7f8">✕</button>
        <b style="font-size:14px">إضافة</b>
      </div>
      <div class="row">
        <div><label>المحفظة</label><select id="wallet"><option>كاش</option><option>بنك</option><option>فودافون كاش</option></select></div>
        <div><label>القيمة *</label><input id="amount" type="number" placeholder="0"></div>
      </div>
      <div class="row">
        <div><label>البند</label><select id="cat"><option>المرتب</option><option>مصاريف</option><option>أكل</option><option>مواصلات</option></select></div>
        <div><label>التاريخ</label><input id="date" type="date"></div>
      </div>
      <div><label>ملاحظة</label><input id="note" placeholder="..."></div>
      
      <div class="footer">
        <button class="save" id="saveBtn" onclick="saveData()">💾 حفظ العملية</button>
        <button class="cancel" onclick="closeModal()">إلغاء</button>
        <div style="text-align:center;font-size:8px;color:#9aa0aa;margin-top:6px">هيتسجل في الشيت العربي الجديد RTL ✅</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw-fO9Xzi2jQhEm5Yy-wgVr4gNLW2wFu6uNquTcDN6ZsFdYOiMjv9E_QKwzyM5DXySDiQ/exec";
document.getElementById('date').valueAsDate = new Date();

let activeType = 'دخل';
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeType = t.dataset.type;
  }
});

function openModal(){document.getElementById('modal').classList.add('active')}
function closeModal(){document.getElementById('modal').classList.remove('active')}

function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function saveData(){
  let amount = document.getElementById('amount').value;
  if(!amount || amount==0){showToast('اكتب القيمة أولاً');return;}
  let row = {
    'المعرف': Date.now(),
    'التاريخ': document.getElementById('date').value,
    'النوع': activeType,
    'البند': document.getElementById('cat').value,
    'المبلغ': amount,
    'المحفظة': document.getElementById('wallet').value,
    'ملاحظات': document.getElementById('note').value,
    'وقت الإنشاء': new Date().toISOString()
  };
  
  // حفظ محلي فوري
  let all = JSON.parse(localStorage.getItem('daily_trans')||'[]');
  all.unshift(row); localStorage.setItem('daily_trans', JSON.stringify(all));
  
  // إرسال للشيت الجديد RTL
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({action:'add', sheet:'daily', row: row})
  }).then(()=> console.log('sent')).catch(e=> console.log(e));

  showToast('تم الحفظ ✅ اتسجل في الشيت');
  closeModal();
  document.getElementById('amount').value='';
  document.getElementById('note').value='';
  renderList();
}

function renderList(){
  let all = JSON.parse(localStorage.getItem('daily_trans')||'[]');
  let sumToday=0; all.forEach(r=>sumToday+=Number(r['المبلغ']||0));
  document.getElementById('today').innerText = sumToday;
  document.getElementById('month').innerText = sumToday;
  document.getElementById('cash').innerText = sumToday;
  if(all.length==0) return;
  document.getElementById('list').innerHTML = all.map(r=>`<div style="background:#fff;border:1px solid #f0f0f0;border-radius:12px;padding:10px;margin:8px 10px;display:flex;justify-content:space-between"><b style="font-size:11px">${r['البند']} - ${r['المبلغ']} ج</b><small style="font-size:8px;color:#9aa0aa">${r['النوع']}</small></div>`).join('');
}
renderList();
</script>
</body>
</html>
