r:#111!important}.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-size:9px;font-weight:700;z-index:200;transition:.3s;opacity:0}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.cell-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:end;justify-content:center;z-index:120}.cell-modal.active{display:flex}.cell-box{width:100%;background:#fff;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto}.cell-head{padding:12px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #f5f5f5;position:sticky;top:0;background:#fff}.cell-body{padding:12px 14px}.cell-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f6f6f6;font-size:9px}

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw-fO9Xzi2jQhEm5Yy-wgVr4gNLW2wFu6uNquTcDN6ZsFdYOiMjv9E_QKwzyM5DXySDiQ/exec";
async function syncToSheet(row) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({action:'add', sheet:'daily', row: row})
    });
    console.log('synced to sheet', row);
  } catch(e) {
    console.error('sheet sync error', e);
  }
}
</script>

<script>
const fmt=n=>{let x=+String(n).replace(/,/g,'');if(!x&&x!==0) return '0';return Math.round(x).toLocaleString('en-US');};
const parseNum=s=>parseFloat(String(s).replace(/,/g,''))||0;
const esc=s=>(s||'').replace(/'/g,"\\'");
function safeMonth(d){try{let x=new Date(d);if(isNaN(x)) return null;return {m:x.getMonth()+1};}catch(e){return null;}}
function todayStr(){return new Date().toISOString().split('T')[0];}
function setToday(){document.getElementById('ae-date').value=todayStr();}
function setTodayDebt(){document.getElementById('ae-date-debt').value=todayStr();}
function setTodayAmanat(){document.getElementById('ae-date-amanat').value=todayStr();}
let db=JSON.parse(localStorage.getItem('master_final')||'null');
if(!db||!db.wallets){db={income:[{id:1,name:'المرتب'}],expense:[{id:1,name:'ايجار'},{id:2,name:'اكل'}],wallets:[{id:1,name:'كاش'},{id:2,name:'بنك'}],amanatPersons:[]}; }
function ensureCash(){if(!db.wallets) db.wallets=[];if(!db.wallets.some(w=>w.name==='كاش')) db.wallets.unshift({id:Date.now(),name:'كاش'});localStorage.setItem('master_final',JSON.stringify(db));}
ensureCash();
if(!db.amanatPersons) db.amanatPersons=[];
let trans=JSON.parse(localStorage.getItem('daily_trans_v2')||'[]');
let debts=JSON.parse(localStorage.getItem('debts_pro_v2')||'[]');
let amanatTrans=JSON.parse(localStorage.getItem('amanat_trans')||'[]');
let curMain='income',curType='income',totalTable='all',inputCb=null;
let currentImageData=null,currentAudioData=null,mediaRecorder=null,audioChunks=[],isRecording=false;
let cameraStreamAdd=null;
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function showMain(t){curMain=t;curType=t==='amanat'?'amanat':t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+t).classList.add('active');if(t==='income') renderIncome();else if(t==='expense') renderExpense();else if(t==='debt') renderDebt();else if(t==='amanat') renderAmanat();else if(t==='total') renderTotal();}
function setTotalTable(t){totalTable=t;document.querySelectorAll('#totalTableChips.chip').forEach(b=>b.classList.remove('active'));document.querySelector(`#totalTableChips [data-tt="${t}"]`)?.classList.add('active');renderTotal();}
function fillCats(){
  let wh=(db.wallets||[]).map(w=>`<option value="${w.name}" ${w.name==='كاش'?'selected':''}>${w.name}</option>`).join('');
  let w1=document.getElementById('ae-wallet');if(w1){w1.innerHTML=wh;w1.value='كاش';}
  let wDebt=document.getElementById('ae-wallet-debt');if(wDebt){wDebt.innerHTML=wh;wDebt.value='كاش';}
  let wAmanat=document.getElementById('ae-wallet-amanat');if(wAmanat){wAmanat.innerHTML=wh;wAmanat.value='كاش';}
  let catEl=document.getElementById('ae-cat');
  let cats=curType==='income'?db.income:curType==='expense'?db.expense:[];
  if(catEl&&cats.length){catEl.innerHTML=cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')+`<option value="new">+ بند جديد</option>`;}
}
function openAdd(type){
  if(type){curMain=type;curType=type==='amanat'?'amanat':type;}else{curType=curMain==='amanat'?'amanat':curMain;}
  document.getElementById('addModal').classList.add('active');
  let formIE=document.getElementById('form-income-expense');
  let formDebt=document.getElementById('form-debt');
  let formAmanat=document.getElementById('form-amanat');
  if(curType==='debt'){formIE.classList.add('hidden');formDebt.classList.remove('hidden');formAmanat.classList.add('hidden');document.getElementById('ae-date-debt').value=todayStr();}
  else if(curType==='amanat'){formIE.classList.add('hidden');formDebt.classList.add('hidden');formAmanat.classList.remove('hidden');document.getElementById('ae-date-amanat').value=todayStr();}
  else{formIE.classList.remove('hidden');formDebt.classList.add('hidden');formAmanat.classList.add('hidden');document.getElementById('ae-date').value=todayStr();}
  fillCats();currentImageData=null;currentAudioData=null;

async function openCameraAdd(){const box=document.getElementById('cameraBoxAdd');box.style.display='block';try{cameraStreamAdd=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});document.getElementById('cameraVideoAdd').srcObject=cameraStreamAdd;}catch(e){showToast('الكاميرا غير متاحة');}}

function takePhotoAdd(){const v=document.getElementById('cameraVideoAdd');const c=document.getElementById('cameraCanvasAdd');if(!v.videoWidth) return showToast('انتظر الكاميرا');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const d=c.toDataURL('image/jpeg',0.6);compressImage(d,cc=>{currentImageData=cc;document.getElementById('previewArea').style.display='block';document.getElementById('imgPreview').innerHTML=`<img src="${cc}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid #f0f0f0;">`;});closeCameraAdd();}
function compressImage(d,cb){let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=600;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.5));};img.src=d;}
document.getElementById('camInput').addEventListener('change',function(e){let file=e.target.files[0];if(!file) return;let r=new FileReader();r.onload=ev=>{compressImage(ev.target.result,c=>{currentImageData=c;document.getElementById('previewArea').style.display='block';document.getElementById('imgPreview').innerHTML=`<img src="${c}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid #f0f0f0;">`;});};r.readAsDataURL(file);});
async function toggleRec(){let btn=document.getElementById('btnVoice');if(!isRecording){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{let b=new Blob(audioChunks,{type:'audio/webm'});let r=new FileReader();r.onload=ev=>{currentAudioData=ev.target.result;document.getElementById('previewArea').style.display='block';document.getElementById('audioPreview').innerHTML=`<audio controls src="${ev.target.result}" style="width:100%;border-radius:8px;height:28px"></audio>`;};r.readAsDataURL(b);};mediaRecorder.start();isRecording=true;if(btn){btn.classList.add('active');btn.innerHTML='⏹️ <span>وقف</span>';}}catch(e){}}else{mediaRecorder.stop();isRecording=false;if(btn){btn.classList.remove('active');btn.innerHTML='🎤 <span>صوت</span>';}}}

    dueList.forEach(d=>{dueHtml+=`<tr><td>${d.person}</td><td>${fmt(d.total)}</td><td style="font-weight:800;">${fmt(d.remaining)}</td><td><button class="icon-btn del" onclick="deleteDebt(${d.id},'${esc(d.person)}')">✕</button></td></tr>`;});
    dueHtml+='</table>';document.getElementById('debtDueReportTable').innerHTML=dueHtml||'<div style="padding:10px;color:#9aa0aa;font-size:9px">لا يوجد مستحقة</div>';
    let oldHtml='<table><tr><th>الشخص</th><th>المبلغ</th><th>الباقي</th><th></th></tr>';
    oldList.forEach(d=>{oldHtml+=`<tr><td>${d.person}</td><td>${fmt(d.total)}</td><td style="font-weight:800;">${fmt(d.remaining)}</td><td><button class="icon-btn del" onclick="deleteDebt(${d.id},'${esc(d.person)}')">✕</button></td></tr>`;});
    oldHtml+='</table>';document.getElementById('debtOldReportTable').innerHTML=oldHtml||'<div style="padding:10px;color:#9aa0aa;font-size:9px">لا يوجد مؤجلة</div>';

    document.getElementById('total-amanat').style.display=(totalTable==='all'||totalTable==='amanat')?'block':'none';
    let amanatHtml='<table><tr><th>الشخص</th><th>داخل</th><th>خارج</th><th>الباقي</th><th></th></tr>';
    let persons=[...new Set(amanatTrans.map(a=>a.person))];
    if(persons.length===0 && db.amanatPersons.length>0) persons=db.amanatPersons;
    persons.forEach(p=>{
      let inSum=amanatTrans.filter(a=>a.person===p&&a.type==='in').reduce((s,a)=>s+a.amount,0);
      let outSum=amanatTrans.filter(a=>a.person===p&&a.type==='out').reduce((s,a)=>s+a.amount,0);
      let bal=inSum-outSum;
      amanatHtml+=`<tr><td>${p}</td><td>${fmt(inSum)}</td><td>${fmt(outSum)}</td><td style="font-weight:800;">${fmt(bal)}</td><td><button class="icon-btn del" onclick="deleteAmanatPerson('${esc(p)}')">✕</button></td></tr>`;
    });
    amanatHtml+='</table>';document.getElementById('amanatReportTable').innerHTML=amanatHtml||'<div style="padding:10px;color:#9aa0aa;font-size:9px">لا يوجد</div>';
  }catch(e){showToast('خطأ: '+e.message);}
}
function renderAll(){renderIncome();renderExpense();renderDebt();renderAmanat();renderTotal();}
function editDebt(id,oldName){openInputModal(`تعديل ${oldName}`,oldName,(newName)=>{let d=debts.find(x=>x.id===id);if(d){d.person=newName;localStorage.setItem('debts_pro_v2',JSON.stringify(debts));renderAll();}});}
function deleteAmanatPerson(person){openInputModal(`مسح ${person} - اكتب: مسح ${person}`,'',(v)=>{if(v!==`مسح ${person}`) return;amanatTrans=amanatTrans.filter(a=>a.person!==person);db.amanatPersons=db.amanatPersons.filter(p=>p!==person);localStorage.setItem('amanat_trans',JSON.stringify(amanatTrans));localStorage.setItem('master_final',JSON.stringify(db));renderAll();});}
document.addEventListener('DOMContentLoaded',()=>{renderAll();});
</script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const observer = new MutationObserver(()=>{
    const btn = document.querySelector('.save-btn');
    if(btn && !btn.dataset.synced){
      btn.dataset.synced='1';
      btn.addEventListener('click', ()=>{
        // collect data from modal inputs
        const modal = document.querySelector('.modal-box');
        if(!modal) return;
        const inputs = modal.querySelectorAll('input, select, textarea');
        let row = {};
        inputs.forEach(inp=>{
          if(inp.placeholder || inp.value){
            row[inp.previousElementSibling?.innerText || inp.name || 'field'] = inp.value;
          }
        });
        // Try to get specific fields
        const amountEl = document.querySelector('input[type="number"], input[placeholder*="قيمة"]');
        const catEl = document.querySelector('select');
        row = {
          'المعرف': Date.now(),
          'التاريخ': new Date().toISOString().split('T')[0],
          'النوع': document.querySelector('.tab.active')?.innerText || 'دخل',
          'البند': catEl?.value || '',
          'المبلغ': amountEl?.value || 0,
          'المحفظة': 'كاش',
          'ملاحظات': '',
          'وقت الإنشاء': new Date().toISOString()
        };
        syncToSheet(row);
      });
    }
  });
  observer.observe(document.body, {childList:true, subtree:true});
});
</script>
