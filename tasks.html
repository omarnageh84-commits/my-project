<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', sans-serif
    }

    body {
      background: #FBF9F6;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden
    }

    .nu-scroll::-webkit-scrollbar {
      width: 0
    }

    .en {
      font-family: monospace !important;
      direction: ltr !important
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #E7E5E4;
      cursor: pointer
    }

    .color-dot.active {
      box-shadow: 0 0 0 2px #111
    }

    .excel-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px
    }

    .excel-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid #eee;
      cursor: pointer
    }

    .tab {
      flex: 1;
      padding: 8px 3px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap
    }

    .tab.active {
      background: #111;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
      font-weight: 800
    }

    #cameraVideo {
      width: 100%;
      border-radius: 12px;
      background: #000;
      aspect-ratio: 3/4;
      object-fit: cover
    }

    .hidden-note {
      background: #111;
      color: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #222
    }

    #deleteWarningModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 11000;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    #deleteWarningModal.show {
      display: flex
    }
  </style>
</head>

<body>
  <div id="app">
    <div
      style="padding:14px 16px;border-bottom:1px solid #F2EFEA;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;gap:10px;align-items:center;">
        <div id="vaultTrigger"
          style="width:40px;height:40px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;user-select:none">
          ✦</div>
        <div>
          <div style="font-weight:700;">مساحة العمل</div>
          <div id="stats" style="font-size:11px;color:#888;"></div>
        </div>
      </div>
      <div style="display:flex;gap:6px;"><button onclick="openManager()"
          style="background:#F5F5F4;border:none;padding:9px 12px;border-radius:10px;font-size:12px;">⚙
          إدارة</button><button onclick="addQuick()"
          style="background:#111;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:700;">+
          جديد</button></div>
    </div>
    <div style="padding:12px;background:#FAFAF9;border-bottom:1px solid #F2EFEA;"><input id="mainInput"
        placeholder="ماذا تريد أن تنجز؟ (اكتب خفي)"
        style="width:100%;background:#fff;border:1px solid #E7E5E4;padding:12px;border-radius:12px;font-size:14px;outline:none;">
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center;"><select id="cat"
          style="flex:1;background:#fff;border:1px solid #E7E5E4;border-radius:10px;padding:10px;font-size:13px;"></select>
        <div id="quickColors" style="display:flex;gap:6px;flex:1;overflow:auto;padding:2px;" class="nu-scroll"></div>
        <button onclick="doAdd()"
          style="background:#111;color:#fff;border:none;border-radius:10px;font-weight:700;padding:10px 16px;">إضافة</button>
      </div><input type="hidden" id="selectedColor">
    </div>
    <div id="board"
      style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FBF9F6;"
      class="nu-scroll"></div>
  </div>

  <!-- مودال تحذير المسح الجديد -->
  <div id="deleteWarningModal" onclick="if(event.target==this)closeDeleteWarning()">
    <div
      style="background:#fff;width:100%;max-width:380px;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <div style="background:#FEF2F2;padding:18px;text-align:center;border-bottom:1px solid #FECACA">
        <div
          style="width:56px;height:56px;background:#FEE2E2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:28px">
          ⚠️</div>
        <div style="font-weight:900;font-size:16px;color:#991B1B">تحذير! هتحذف المهمة نهائياً؟</div>
        <div style="font-size:11px;color:#B91C1C;margin-top:4px">العملية لا يمكن التراجع عنها</div>
      </div>
      <div style="padding:16px">
        <div id="delTaskPreview"
          style="background:#FAFAF9;border:1px solid #F2EFEA;border-radius:12px;padding:12px;margin-bottom:12px"></div>
        <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;margin-bottom:6px">سيتم حذف:</div>
          <div id="delDetails" style="font-size:11px;color:#92400E;line-height:1.6"></div>
        </div>
        <label
          style="display:flex;gap:8px;align-items:center;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:10px;cursor:pointer">
          <input type="checkbox" id="delConfirmCheck" onchange="toggleDelBtn()" style="width:16px;height:16px">
          <span style="font-size:12px;font-weight:600">أنا متأكد عايز أمسح المهمة دي نهائياً</span>
        </label>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button onclick="closeDeleteWarning()"
            style="flex:1;background:#F5F5F4;border:none;padding:12px;border-radius:11px;font-weight:700">إلغاء</button>
          <button id="finalDelBtn" onclick="confirmDelete()" disabled
            style="flex:1;background:#E5E7EB;color:#9CA3AF;border:none;padding:12px;border-radius:11px;font-weight:800;cursor:not-allowed">🗑
            حذف نهائي</button>
        </div>
      </div>
    </div>
  </div>

  <div id="managerModal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:16px;">
    <div
      style="background:#fff;width:100%;max-width:420px;border-radius:20px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;">
      <div style="display:flex;gap:4px;background:#F5F5F4;margin:12px;padding:4px;border-radius:12px;"><button
          onclick="mTab('cats')" id="mTabCats"
          style="flex:1;padding:10px;border:none;border-radius:8px;background:#fff;font-weight:700;">📁
          التصنيفات</button><button onclick="mTab('colors')" id="mTabColors"
          style="flex:1;padding:10px;border:none;border-radius:8px;background:transparent;">🎨 الألوان</button></div>
      <div style="flex:1;overflow:auto;padding:0 16px 16px;" class="nu-scroll">
        <div id="mCats">
          <div style="display:flex;gap:6px;margin-bottom:14px;"><input id="newCatEmoji" placeholder="💊"
              style="width:50px;text-align:center;border:1px solid #E7E5E4;border-radius:10px;padding:10px;"><input
              id="newCatName" placeholder="اسم التصنيف"
              style="flex:1;border:1px solid #E7E5E4;border-radius:10px;padding:10px;"><button onclick="addCategory()"
              style="background:#111;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:700;">+</button>
          </div>
          <div id="catList"></div>
        </div>
        <div id="mColors" style="display:none;">
          <div id="excelTheme" class="excel-grid" style="margin-bottom:12px;"></div>
          <div id="excelStandard" class="excel-grid"></div>
          <div id="colorList" style="margin-top:10px;"></div>
        </div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid #F2EFEA;"><button onclick="closeManager()"
          style="width:100%;background:#F5F5F4;border:none;padding:11px;border-radius:12px;font-weight:600;">إغلاق</button>
      </div>
    </div>
  </div>

  <div id="modal" style="display:none;position:fixed;inset:0;background:#fff;z-index:9999;flex-direction:column;">
    <div id="modalCover" style="height:70px;position:relative;flex-shrink:0;"><button onclick="closeModal()"
        style="position:absolute;top:14px;left:14px;background:rgba(0,0,0,.2);border:none;width:32px;height:32px;border-radius:50%;color:#fff;">✕</button>
    </div>
    <div style="padding:12px;flex:1;overflow:auto;" class="nu-scroll">
      <h2 id="modalTitle" contenteditable="true"
        style="font-size:15px;font-weight:700;outline:none;border-bottom:1px dashed #E7E5E4;padding-bottom:6px;margin-bottom:10px;">
      </h2>
      <div style="background:#fff;border:1px solid #F2EFEA;border-radius:16px;padding:10px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><b
            style="font-size:12px;">✔ مهام فرعية</b><span id="subProgress"
            style="font-size:11px;background:#F5F5F4;padding:2px 8px;border-radius:20px;">0/0</span></div>
        <div id="subList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:6px;"></div>
        <div style="display:flex;gap:6px;"><input id="subInput" placeholder="مهمة فرعية + Enter"
            style="flex:1;border:1px solid #F2EFEA;border-radius:10px;padding:8px 10px;font-size:13px;"><button
            onclick="addSub()"
            style="background:#111;color:#fff;border:none;padding:8px 12px;border-radius:10px;font-weight:700;">+</button>
        </div>
        <div style="height:4px;background:#F5F5F4;border-radius:10px;margin-top:8px;overflow:hidden;">
          <div id="subBar" style="height:100%;width:0%;background:#111;"></div>
        </div>
      </div>
      <div
        style="display:flex;gap:4px;background:#F5F5F4;padding:4px;border-radius:12px;margin-bottom:10px;overflow:auto;"
        class="nu-scroll">
        <button onclick="tab('colors')" id="tColors" class="tab active">🎨 ألوان</button>
        <button onclick="tab('camera')" id="tCamera" class="tab">📷 كاميرا</button>
        <button onclick="tab('draw')" id="tDraw" class="tab">✏ رسم</button>
        <button onclick="tab('voice')" id="tVoice" class="tab">🎙 فويس</button>
        <button onclick="tab('note')" id="tNote" class="tab">📝 نوت</button>
        <button onclick="tab('rem')" id="tRem" class="tab">⏰ منبه</button>
        <button onclick="tab('hidden')" id="tHidden" class="tab" style="display:none;background:#000;color:#fff">🔒
          الخفي</button>
      </div>
      <div id="pColors">
        <div
          style="display:flex;gap:8px;align-items:center;background:#F5F5F4;padding:10px;border-radius:12px;margin-bottom:8px;">
          <div style="font-size:11px;font-weight:700;">اللون الحالي:</div>
          <div id="currentColorPreview"
            style="width:28px;height:28px;border-radius:8px;border:1px solid #ddd;background:#fff"></div><button
            onclick="toggleAllColors()"
            style="margin-right:auto;background:#fff;border:1px solid #E7E5E4;padding:6px 10px;border-radius:8px;font-size:11px;">عرض
            كل الألوان ▼</button>
        </div>
        <div id="allColorsBox"
          style="display:none;max-height:220px;overflow:auto;background:#FAFAF9;padding:8px;border-radius:12px;border:1px solid #F2EFEA;"
          class="nu-scroll">
          <div id="modalColorsTheme" class="excel-grid" style="margin-bottom:8px;"></div>
          <div id="modalColorsStandard" class="excel-grid" style="margin-bottom:8px;"></div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:8px;">
            <div onclick="selectModalColor('transparent')"
              style="width:32px;height:32px;border-radius:6px;background:#fff;border:2px dashed #999;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer">
              بلا</div><input type="color" id="customColor" value="#ff0000" onchange="selectModalColor(this.value)"
              style="width:36px;height:32px;border:none;border-radius:6px;"><span style="font-size:10px;color:#888;">لون
              مخصص</span>
          </div>
        </div>
      </div>
      <div id="pCamera" style="display:none;">
        <div style="display:flex;gap:6px;margin-bottom:8px;"><button onclick="openCamera()"
            style="flex:1;background:#111;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;">📷
            فتح الكاميرا</button><button onclick="document.getElementById('task-photo-file').click()"
            style="flex:1;background:#F5F5F4;border:none;padding:10px;border-radius:10px;font-weight:700;">🖼 من
            المعرض</button><input type="file" id="task-photo-file" accept="image/*" style="display:none"
            onchange="handleFile(this)"></div>
        <div id="cameraBox" style="display:none;"><video id="cameraVideo" autoplay playsinline></video><canvas
            id="cameraCanvas" style="display:none;"></canvas>
          <div style="display:flex;gap:8px;margin-top:8px;"><button onclick="closeCamera()"
              style="flex:1;background:#F5F5F4;border:none;padding:9px;border-radius:8px;">إلغاء</button><button
              onclick="takePhoto()"
              style="flex:1;background:#111;color:#fff;border:none;padding:9px;border-radius:8px;font-weight:700;">📷
              التقاط</button></div>
        </div>
        <div id="photoGallery" style="display:flex;gap:8px;overflow:auto;flex-wrap:wrap;margin-top:10px;"></div>
      </div>
      <div id="pDraw" style="display:none;"><canvas id="canvas"
          style="width:100%;height:180px;border:2px dashed #E7E5E4;border-radius:12px;"></canvas>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;"><input type="color" id="penColor"
            value="#111111" style="width:40px;height:36px;border:none;border-radius:8px;"><input type="range"
            id="penSize" min="1" max="15" value="4" style="flex:1;"><button onclick="clearCanvas()"
            style="background:#FEE2E2;border:none;padding:8px 12px;border-radius:8px;font-size:12px;">مسح</button></div>
        <button onclick="saveDraw()"
          style="width:100%;margin-top:8px;background:#111;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;">💾
          حفظ</button>
        <div id="drawGallery" style="display:flex;gap:8px;overflow:auto;margin-top:10px;"></div>
      </div>
      <div id="pVoice" style="display:none;">
        <div style="background:#F5F5F4;border-radius:16px;padding:16px;text-align:center;">
          <div id="timer" class="en" style="font-size:22px;font-weight:800;">00:00</div><button id="recBtn"
            onclick="toggleRec()"
            style="width:64px;height:64px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:24px;margin-top:8px;">●</button>
        </div>
        <div id="voiceList" style="margin-top:10px;display:flex;flex-direction:column;gap:8px;"></div>
      </div>
      <div id="pNote" style="display:none;"><textarea id="note" placeholder="ملاحظات... 10000 = 10,000"
          style="width:100%;min-height:100px;border:1px solid #E7E5E4;border-radius:12px;padding:12px;"></textarea><button
          onclick="saveNote()"
          style="width:100%;margin-top:8px;background:#111;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;">حفظ</button>
        <div id="notePreview" style="margin-top:8px;font-size:12px;color:#555;white-space:pre-wrap;"></div>
      </div>
      <div id="pRem" style="display:none;">
        <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px;"><label
            style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px;"><input type="checkbox"
              id="remEnabled" onchange="toggleRem()"> تفعيل المنبه</label>
          <div id="remBox" style="display:none;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;"><input type="date"
                id="remDate" style="border:1px solid #E7E5E4;border-radius:8px;padding:8px;font-size:12px;"><input
                type="time" id="remTime" style="border:1px solid #E7E5E4;border-radius:8px;padding:8px;font-size:12px;">
            </div><select id="remRepeat"
              style="width:100%;border:1px solid #E7E5E4;border-radius:8px;padding:8px;font-size:12px;margin-bottom:6px;">
              <option value="none">لا يتكرر</option>
              <option value="daily">يومياً</option>
              <option value="weekly">أسبوعياً</option>
              <option value="monthly">شهرياً</option>
              <option value="hourly">كل ساعة</option>
              <option value="custom">مخصص</option>
            </select>
            <div id="customRepeat" style="display:none;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;"><input
                id="customInterval" type="number" value="1"
                style="border:1px solid #E7E5E4;border-radius:8px;padding:8px;"><select id="customUnit"
                style="border:1px solid #E7E5E4;border-radius:8px;padding:8px;">
                <option value="minutes">دقائق</option>
                <option value="hours">ساعات</option>
                <option value="days">أيام</option>
              </select></div>
            <div id="remNext" style="font-size:10px;color:#92400E;"></div><button onclick="saveReminder()"
              style="width:100%;margin-top:8px;background:#f59e0b;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;">حفظ
              المنبه</button>
          </div>
        </div>
      </div>

      <div id="pHidden" style="display:none;">
        <div id="hiddenAuth"
          style="background:#0F0F0F;border-radius:16px;padding:16px;color:#fff;border:1px solid #222">
          <div style="text-align:center;padding:10px">
            <div style="font-size:40px">🔒</div>
            <div style="font-weight:800;margin-top:6px" id="hAuthTitle">تبويب الخفي محمي</div>
            <div style="font-size:11px;color:#777;margin-top:4px">مشفر AES-256 • محدش يقدر يوصله غيرك</div>
          </div>
          <input id="hPass" type="password" placeholder="اكتب رمز الخفي"
            style="width:100%;background:#1A1A1A;border:1px solid #2A2A2A;padding:13px;border-radius:11px;color:#fff;text-align:center;letter-spacing:3px;margin-top:12px;outline:none">
          <button onclick="unlockHidden()"
            style="width:100%;margin-top:10px;background:#fff;color:#000;border:none;padding:12px;border-radius:11px;font-weight:800">فتح
            التبويب 🔓</button>
          <div id="hErr" style="color:#ff5a5a;font-size:11px;text-align:center;margin-top:8px;display:none"></div>
          <div style="font-size:10px;color:#555;text-align:center;margin-top:10px">أول مرة؟ اكتب رمز جديد وهيتعمل تلقائي
          </div>
        </div>
        <div id="hiddenContent" style="display:none">
          <div style="background:#0F0F0F;border-radius:16px;padding:12px;border:1px solid #222;margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b
                style="font-size:13px">📓 نوتس الخفي</b>
              <div style="display:flex;gap:6px"><button onclick="addHiddenNote()"
                  style="background:#fff;color:#000;border:none;padding:7px 12px;border-radius:8px;font-weight:800;font-size:11px">+
                  نوت</button><button onclick="hideHiddenTab()"
                  style="background:#1A1A1A;border:1px solid #2A2A2A;color:#fff;padding:7px 10px;border-radius:8px;font-size:11px">إخفاء
                  👁️‍🗨️</button></div>
            </div>
            <input id="hSearch" placeholder="بحث..." oninput="renderHidden()"
              style="width:100%;background:#1A1A1A;border:1px solid #2A2A2A;padding:9px 12px;border-radius:9px;color:#fff;font-size:12px;margin-bottom:10px">
            <div id="hList" style="max-height:52vh;overflow:auto" class="nu-scroll"></div>
            <div style="display:flex;justify-content:space-between;margin-top:10px"><span id="hCount"
                style="font-size:10px;color:#666"></span><button onclick="lockHidden()"
                style="background:#1A1A1A;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:8px;font-size:10px">🔒
                قفل</button></div>
          </div>
        </div>
      </div>

    </div>
    <div style="padding:10px 12px;border-top:1px solid #F2EFEA;display:flex;gap:8px;"><button onclick="deleteCurrent()"
        style="background:#FFF1F2;color:#ef4444;border:1px solid #FECDD3;padding:10px 14px;border-radius:10px;flex:1;font-weight:700">🗑
        حذف</button><button onclick="toggleDone()" id="doneBtn"
        style="background:#111;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:700;flex:2;">تم
        ✓</button></div>
  </div>

  <script>
    function fmt(n) { if (n === '' || n == null) return ''; let x = typeof n === 'string' ? parseFloat(n.toString().replace(/,/g, '')) : n; if (isNaN(x)) return n; return x.toLocaleString('en-US') }
    function formatTextNumbers(t) { return t.replace(/\b\d{4,}\b/g, m => fmt(m)) }

    }
    async function saveHidden() { if (!hKey) return; const enc = await hEnc(hNotes, hKey); localStorage.setItem(H_DATA, JSON.stringify(enc)) }
    function renderHidden() { const q = (document.getElementById('hSearch').value || '').toLowerCase(); const list = document.getElementById('hList'); const f = hNotes.filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q)).sort((a, b) => b.id - a.id); document.getElementById('hCount').innerText = `${f.length} نوتس سرية • مشفرة`; if (!f.length) { list.innerHTML = `<div style="text-align:center;padding:20px;color:#555;font-size:12px">مفيش نوتس سرية لسه</div>`; return } list.innerHTML = f.map(n => `<div class="hidden-note"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">${n.title.replace(/</g, '&lt;')}</b><div style="display:flex;gap:6px"><button onclick="editHidden(${n.id})" style="background:#222;border:none;color:#fff;width:24px;height:24px;border-radius:6px">✏️</button><button onclick="delHidden(${n.id})" style="background:#3a1515;border:none;color:#ff6b6b;width:24px;height:24px;border-radius:6px">✕</button></div></div><div style="font-size:12px;color:#ccc;margin-top:6px;white-space:pre-wrap">${n.body.replace(/</g, '&lt;')}</div><div style="font-size:9px;color:#555;margin-top:6px">${new Date(n.id).toLocaleString('ar-EG')}</div></div>`).join(''); }
    function addHiddenNote() { const t = prompt('عنوان النوت الخفي:'); if (t === null) return; const b = prompt('المحتوى:'); if (b === null) return; if (!t.trim() && !b.trim()) return; hNotes.unshift({ id: Date.now(), title: t.trim() || 'بدون عنوان', body: b.trim() }); saveHidden(); renderHidden() }
    function editHidden(id) { const n = hNotes.find(x => x.id === id); if (!n) return; const nt = prompt('عدل العنوان:', n.title); if (nt === null) return; const nb = prompt('عدل المحتوى:', n.body); if (nb === null) return; n.title = nt.trim(); n.body = nb.trim(); saveHidden(); renderHidden() }
    function delHidden(id) { if (!confirm('تحذف؟')) return; hNotes = hNotes.filter(x => x.id !== id); saveHidden(); renderHidden() }
    (function () { const trig = document.getElementById('vaultTrigger'); let tm = null; function sp(e) { e.preventDefault(); tm = setTimeout(revealHiddenTab, 1200) } function cp() { clearTimeout(tm) } trig.addEventListener('touchstart', sp, { passive: false }); trig.addEventListener('touchend', cp); trig.addEventListener('mousedown', sp); trig.addEventListener('mouseup', cp); trig.addEventListener('mouseleave', cp); document.getElementById('hPass').addEventListener('keydown', e => { if (e.key === 'Enter') unlockHidden() }); })();
  </script>
</body>
