<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;transition:.3s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:16px;font-weight:800} .top h1 span{color:var(--primary)}
.badge{font-size:9px;background:var(--bg-soft);border:1px solid var(--card-border);padding:5px 10px;border-radius:99px;color:var(--text-soft)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:10px}
input{width:100%;background:var(--bg-soft);border:1px solid var(--card-border);color:var(--text);padding:11px;border-radius:10px;margin:6px 0;font-size:13px;outline:none}
button{width:100%;background:var(--hero);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer}
.prog{height:6px;background:var(--bg-soft);border-radius:99px;margin:10px 0;overflow:hidden;border:1px solid var(--card-border)}
.prog div{height:100%;background:var(--primary);transition:width .5s}
.task{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.task.done{opacity:.5} .task.done .t{ text-decoration:line-through }
.task .t{font-size:12px;font-weight:700}
.actions{display:flex;gap:5px}
.actions button{width:auto;padding:6px 12px;font-size:10px;border-radius:8px}
.ok{background:var(--bg-soft);color:var(--primary);border:1px solid var(--card-border)} .ok.done{background:var(--primary);color:#fff}
.del{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
</style>
</head>
<body>
<div class="top"><h1>✅ <span>المهام</span></h1><div class="badge" id="st">⏳ جاري الاتصال...</div></div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:10px"><span>التقدم</span><span id="perc">0%</span></div>
<div class="prog"><div id="bar" style="width:0%"></div></div>
<div style="display:flex;gap:6px">
<input id="taskTitle" placeholder="اكتب مهمة جديدة...">
<button style="width:90px" onclick="addTask()">إضافة +</button>
</div>
</div>

<div id="tasksList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFY2u5XCwowJ2_kiOZoH8n52RgwoSLuog",
  authDomain: "omar-project-32c66.firebaseapp.com",
  projectId: "omar-project-32c66",
  storageBucket: "omar-project-32c66.firebasestorage.app",
  messagingSenderId: "565578222991",
  appId: "1:565578222991:web:19231bf26995849d874ffa",
  measurementId: "G-9DWP9EZHRF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "tasks");

document.getElementById("st").innerText = "✅ متصل - محفوظ Online";

window.addTask = async ()=>{
  const title=document.getElementById("taskTitle").value.trim();
  if(!title) return alert("اكتب المهمة");
  await addDoc(colRef, { title, done:false, createdAt: serverTimestamp(), owner:"omar" });
  document.getElementById("taskTitle").value="";
}

onSnapshot(query(colRef, orderBy("createdAt","desc")), (snap)=>{
  const list=document.getElementById("tasksList");
  list.innerHTML="";
  let total=0,done=0;
  snap.forEach(d=>{ total++; if(d.data().done) done++; });
  const perc = total?Math.round(done/total*100):0;
  document.getElementById("bar").style.width=perc+"%";
  document.getElementById("perc").innerText=perc+"% - "+done+"/"+total;

  if(total===0){ list.innerHTML=`<div style="text-align:center;color:var(--text-soft);font-size:11px;padding:30px">لا يوجد مهام - أضف أول مهمة</div>`; return; }

  snap.forEach(d=>{
    const data=d.data();
    const div=document.createElement("div");
    div.className="task"+(data.done?" done":"");
    div.innerHTML=`
      <span class="t">${data.title}</span>
      <div class="actions">
        <button class="ok ${data.done?'done':''}" onclick="toggleTask('${d.id}', ${data.done})">${data.done?'تم ✓':'تم'}</button>
        <button class="del" onclick="delTask('${d.id}')">حذف</button>
      </div>
    `;
    list.appendChild(div);
  });
});

window.toggleTask = async (id,done)=>{ await updateDoc(doc(db,"tasks",id), {done:!done}); }
window.delTask = async (id)=>{ if(confirm("حذف المهمة؟")) await deleteDoc(doc(db,"tasks",id)); }
</script>
</body>
</html>
