<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>مساحة العمل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:#FBF9F6;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden;max-width:600px;margin:0 auto;width:100%;border-left:1px solid #eee;border-right:1px solid #eee}
.nu-scroll::-webkit-scrollbar{width:0}
.color-dot{width:22px;height:22px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px #E7E5E4;cursor:pointer;flex-shrink:0}
.color-dot.active{box-shadow:0 0 0 2.5px #111}
.excel-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.excel-cell{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid #eee;cursor:pointer}
.tab{flex:1;padding:9px 3px;border:none;border-radius:10px;background:transparent;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#111;color:#fff;font-weight:800}
#cameraVideo{width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover}
.hidden-note{background:#111;color:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #222;line-height:1.8}
.filter-chip{padding:8px 14px;border-radius:20px;border:1.5px solid #E7E5E4;background:#fff;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.filter-chip.active{background:#111;color:#fff;border-color:#111}
#deleteWarningModal,#secretCodeModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:11000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
#deleteWarningModal.show,#secretCodeModal.show{display:flex}
.rich-toolbar{display:flex;gap:6px;padding:10px;background:#F5F5F4;border-radius:12px;margin-bottom:8px;overflow:auto;align-items:center;flex-shrink:0}
.rich-toolbar button{border:1px solid #E7E5E4;background:#fff;padding:7px 12px;border-radius:8px;font-weight:800;flex-shrink:0;cursor:pointer}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;flex-shrink:0}
.rich-editor{flex:1;min-height:40vh;border:1px solid #E7E5E4;border-radius:12px;padding:14px;outline:none;background:#fff;line-height:2;overflow:auto;direction:rtl;text-align:right;white-space:pre-wrap;word-break:break-word}
#board{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FBF9F6}
</style>
</head>
<body>
<div id="app">
<div style="padding:14px 16px;border-bottom:1px solid #F2EFEA;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;z-index:5">
<div style="display:flex;gap:10px;align-items:center;"><div id="vaultTrigger" style="width:42px;height:42px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:18px;user-select:none">✦</div><div><div style="font-weight:800;font-size:15px">مساحة العمل</div><div id="stats" style="font-size:11px;color:#888;"></div></div></div>
<div style="display:flex;gap:6px;"><button onclick="openManager()" style="background:#F5F5F4;border:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700">⚙ إدارة</button><button onclick="addQuick()" style="background:#111;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:800;cursor:pointer">+ جديد</button></div>
</div>
<div style="padding:12px;background:#FAFAF9;border-bottom:1px solid #F2EFEA;">
<input id="mainInput" placeholder="ابحث أو أضف مهمة..." style="width:100%;background:#fff;border:1.5px solid #E7E5E4;padding:12px;border-radius:12px;outline:none;font-weight:700">
<div style="display:flex;gap:8px;margin-top:10px;align-items:center;"><select id="cat" style="flex:1;background:#fff;border:1.5px solid #E7E5E4;border-radius:10px;padding:10px;font-weight:700"></select><div id="quickColors" style="display:flex;gap:6px;flex:1;overflow:auto" class="nu-scroll"></div><button onclick="doAdd()" style="background:#111;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:900;cursor:pointer">إضافة</button></div>
</div>
<div style="background:#fff;border-bottom:1px solid #F2EFEA;padding:10px 12px;"><div id="taskTabsFilter" style="display:flex;gap:6px;overflow:auto" class="nu-scroll">
<button onclick="filterTasksTab('all')" id="tt_all" class="filter-chip active">الكل</button>
<button onclick="filterTasksTab('صيدلية')" id="tt_صيدلية" class="filter-chip">💊 صيدلية</button>
<button onclick="filterTasksTab('شغل')" id="tt_شغل" class="filter-chip">💻 شغل</button>
<button onclick="filterTasksTab('شخصي')" id="tt_شخصي" class="filter-chip">🏠 شخصي</button>
<button onclick="filterTasksTab('done')" id="tt_done" class="filter-chip">✓ منجز</button>
</div></div>
<div id="board" class="nu-scroll"></div>
</div>

<div id="secretCodeModal" onclick="if(event.target==this)closeSecretModal()"><div style="background:#111;color:#fff;width:100%;max-width:340px;border-radius:22px;padding:22px;border:1px solid #222"><div style="text-align:center"><div style="width:50px;height:50px;background:#1A1A1A;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px">✦</div><div style="font-weight:800;font-size:14px">الرقم التعريفي السري</div><div style="font-size:11px;color:#777;margin-top:4px;line-height:1.6">الرقم اللي هتكتبه في البحث<br>عشان تفتح القسم الخاص</div></div><input id="secretInput" type="tel" inputmode="numeric" placeholder="مثال: 279" style="width:100%;background:#1A1A1A;border:1.5px solid #333;padding:14px;border-radius:12px;color:#fff;text-align:center;margin-top:14px;font-size:18px;font-weight:800;letter-spacing:3px"><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeSecretModal()" style="flex:1;background:#222;color:#fff;border:none;padding:12px;border-radius:11px;font-weight:700">إلغاء</button><button onclick="saveSecretCode()" style="flex:1;background:#fff;color:#000;border:none;padding:12px;border-radius:11px;font-weight:900">حفظ الرقم</button></div><div id="currentCodeHint" style="font-size:10px;color:#555;text-align:center;margin-top:10px"></div></div></div>

<div id="deleteWarningModal" onclick="if(event.target==this)closeDeleteWarning()"><div style="background:#fff;width:100%;max-width:360px;border-radius:22px;overflow:hidden"><div style="background:#FEF2F2;padding:18px;text-align:center"><div style="font-size:36px">⚠️</div><div style="font-weight:900;color:#991B1B">هتحذف؟</div></div><div style="padding:16px"><div id="delTaskPreview" style="background:#FAFAF9;border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px"></div><label style="display:flex;gap:8px;align-items:center;background:#F9FAFB;border:1px solid #E7E5E4;border-radius:10px;padding:10px"><input type="checkbox" id="delConfirmCheck" onchange="toggleDelBtn()"><span style="font-size:12px;font-weight:700">أنا متأكد</span></label><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeDeleteWarning()" style="flex:1;background:#F5F5F4;border:none;padding:12px;border-radius:11px">إلغاء</button><button id="finalDelBtn" onclick="confirmDelete()" disabled style="flex:1;background:#E5E7EB;color:#9CA3AF;border:none;padding:12px;border-radius:11px;font-weight:800">حذف</button></div></div></div></div>
<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;width:100%;max-width:420px;border-radius:20px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column"><div style="display:flex;gap:4px;background:#F5F5F4;margin:12px;padding:4px;border-radius:12px"><button onclick="mTab('cats')" id="mTabCats" style="flex:1;padding:10px;border:none;border-radius:8px;background:#fff;font-weight:700">📁 التصنيفات</button><button onclick="mTab('colors')" id="mTabColors" style="flex:1;padding:10px;border:none;border-radius:8px;background:transparent">🎨 الألوان</button></div><div style="flex:1;overflow:auto;padding:0 16px 16px" class="nu-scroll"><div id="mCats"><div style="display:flex;gap:6px;margin-bottom:14px"><input id="newCatEmoji" placeholder="💊" style="width:50px;text-align:center;border:1px solid #E7E5E4;border-radius:10px;padding:10px"><input id="newCatName" placeholder="اسم التصنيف" style="flex:1;border:1px solid #E7E5E4;border-radius:10px;padding:10px"><button onclick="addCategory()" style="background:#111;color:#fff;border:none;padding:10px 14px;border-radius:10px">+</button></div><div id="catList"></div></div><div id="mColors" style="display:none"><div id="excelTheme" class="excel-grid" style="margin-bottom:12px"></div><div id="excelStandard" class="excel-grid"></div><div id="colorList" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div></div></div><div style="padding:12px 16px;border-top:1px solid #F2EFEA"><button onclick="closeManager()" style="width:100%;background:#F5F5F4;border:none;padding:11px;border-radius:12px">إغلاق</button></div></div></div>

<div id="modal" style="display:none;position:fixed;inset:0;background:#fff;z-index:9999;flex-direction:column;max-width:600px;margin:0 auto">
<div id="modalCover" style="height:80px;position:relative;flex-shrink:0;background:#fff;border-bottom:1px solid #eee"><button onclick="closeModal()" style="position:absolute;top:14px;left:14px;background:rgba(0,0,0,.15);border:none;width:34px;height:34px;border-radius:50%;color:#000;font-weight:800;cursor:pointer">✕</button></div>
<div style="padding:12px;flex:1;overflow:auto;display:flex;flex-direction:column" class="nu-scroll">
<h2 id="modalTitle" contenteditable="true" style="font-size:16px;font-weight:800;outline:none;border-bottom:1.5px dashed #E7E5E4;padding-bottom:8px;margin-bottom:12px;flex-shrink:0"></h2>
<div style="background:#fff;border:1.5px solid #F2EFEA;border-radius:16px;padding:10px;margin-bottom:12px;flex-shrink:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:12px">✔ مهام فرعية</b><span id="subProgress" style="font-size:11px;background:#F5F5F4;padding:3px 9px;border-radius:20px;font-weight:700">0/0</span></div><div id="subList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div><div style="display:flex;gap:6px"><input id="subInput" placeholder="مهمة فرعية + Enter" style="flex:1;border:1px solid #F2EFEA;border-radius:10px;padding:10px"><button onclick="addSub()" style="background:#111;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800">+</button></div><div style="height:5px;background:#F5F5F4;border-radius:10px;margin-top:10px;overflow:hidden"><div id="subBar" style="height:100%;width:0%;background:#111"></div></div></div>
<div style="display:flex;gap:4px;background:#F5F5F4;padding:4px;border-radius:12px;margin-bottom:12px;overflow:auto;flex-shrink:0" class="nu-scroll">
<button onclick="tab('colors')" id="tColors" class="tab">🎨 ألوان</button>
<button onclick="tab('camera')" id="tCamera" class="tab">📷 كاميرا</button>
<button onclick="tab('draw')" id="tDraw" class="tab">✏ رسم</button>
<button onclick="tab('voice')" id="tVoice" class="tab">🎙 فويس</button>
<button onclick="tab('note')" id="tNote" class="tab active">📝 نوت</button>
<button onclick="tab('rem')" id="tRem" class="tab">⏰ منبه</button>
<button onclick="tab('hidden')" id="tHidden" class="tab" style="display:none;background:#000;color:#fff">🔒 الخاص</button>
</div>
<div id="pColors" style="display:none"><div style="display:flex;gap:8px;align-items:center;background:#F5F5F4;padding:10px;border-radius:12px;margin-bottom:8px"><div style="font-size:11px;font-weight:700">اللون الحالي:</div><div id="currentColorPreview" style="width:28px;height:28px;border-radius:8px;border:1px solid #ddd;background:#fff"></div><button onclick="toggleAllColors()" style="margin-right:auto;background:#fff;border:1px solid #E7E5E4;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700">عرض كل الألوان ▼</button></div><div id="allColorsBox" style="display:none;max-height:260px;overflow:auto;background:#FAFAF9;padding:8px;border-radius:12px;border:1px solid #F2EFEA" class="nu-scroll"><div id="modalColorsTheme" class="excel-grid" style="margin-bottom:8px"></div><div id="modalColorsStandard" class="excel-grid"></div></div></div>
<div id="pCamera" style="display:none"><div style="display:flex;gap:6px;margin-bottom:8px"><button onclick="openCamera()" style="flex:1;background:#111;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:700">📷 فتح الكاميرا</button><button onclick="document.getElementById('task-photo-file').click()" style="flex:1;background:#F5F5F4;border:none;padding:11px;border-radius:10px;font-weight:700">🖼 معرض</button><input type="file" id="task-photo-file" accept="image/*" style="display:none" onchange="handleFile(this)"></div><div id="cameraBox" style="display:none"><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas" style="display:none"></canvas><div style="display:flex;gap:8px;margin-top:8px"><button onclick="closeCamera()" style="flex:1;background:#F5F5F4;border:none;padding:10px;border-radius:8px;font-weight:700">إلغاء</button><button onclick="takePhoto()" style="flex:1;background:#111;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700">التقاط</button></div></div><div id="photoGallery" style="display:flex;gap:8px;overflow:auto;flex-wrap:wrap;margin-top:10px"></div></div>
<div id="pDraw" style="display:none"><canvas id="canvas" style="width:100%;height:200px;border:2px dashed #E7E5E4;border-radius:12px;background:#fff"></canvas><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input type="color" id="penColor" value="#111111" style="width:44px;height:40px;border:none;border-radius:8px"><input type="range" id="penSize" min="1" max="15" value="4" style="flex:1"><button onclick="clearCanvas()" style="background:#FEE2E2;border:none;padding:9px 12px;border-radius:8px;font-weight:700">مسح</button></div><button onclick="saveDraw()" style="width:100%;margin-top:8px;background:#111;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:700">💾 حفظ الرسم</button><div id="drawGallery" style="display:flex;gap:8px;overflow:auto;margin-top:10px;flex-wrap:wrap"></div></div>
<div id="pVoice" style="display:none"><div style="background:#F5F5F4;border-radius:16px;padding:16px;text-align:center"><div id="timer" style="font-size:24px;font-weight:800">00:00</div><button id="recBtn" onclick="toggleRec()" style="width:70px;height:70px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:26px;margin-top:10px;cursor:pointer">●</button><div style="font-size:11px;color:#888;margin-top:6px">دوس للتسجيل</div></div><div id="voiceList" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div></div>
<div id="pNote" style="display:flex;flex:1;flex-direction:column"><div class="rich-toolbar"><button onclick="formatNote('bold')"><b>B</b></button><button onclick="formatNote('insertUnorderedList')">• نقط</button><button onclick="formatNote('insertOrderedList')">1. ترقيم</button><div class="dot" style="background:#ef4444" onclick="applyNoteColor('#ef4444')"></div><div class="dot" style="background:#f59e0b" onclick="applyNoteColor('#f59e0b')"></div><div class="dot" style="background:#22c55e" onclick="applyNoteColor('#22c55e')"></div><div class="dot" style="background:#3b82f6" onclick="applyNoteColor('#3b82f6')"></div><div class="dot" style="background:#8b5cf6" onclick="applyNoteColor('#8b5cf6')"></div><div class="dot" style="background:#111" onclick="applyNoteColor('#111111')"></div></div><div id="noteEditor" class="rich-editor" contenteditable="true"></div><button onclick="saveNote()" style="width:100%;margin-top:10px;background:#111;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800">حفظ النوت بالألوان</button></div>
<div id="pRem" style="display:none"><div style="background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:12px;padding:12px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:10px"><input type="checkbox" id="remEnabled" onchange="toggleRem()"> تفعيل المنبه</label><div id="remBox" style="display:none"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px"><input type="date" id="remDate" style="border:1px solid #E7E5E4;border-radius:8px;padding:9px"><input type="time" id="remTime" style="border:1px solid #E7E5E4;border-radius:8px;padding:9px"></div><select id="remRepeat" style="width:100%;border:1px solid #E7E5E4;border-radius:8px;padding:9px;margin-bottom:6px"><option value="none">لا يتكرر</option><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option></select><div id="remNext" style="font-size:11px;color:#92400E;font-weight:700"></div><button onclick="saveReminder()" style="width:100%;margin-top:10px;background:#f59e0b;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:800">حفظ المنبه</button></div></div></div>
<div id="pHidden" style="display:none">
<div id="hiddenAuth" style="background:#0F0F0F;border-radius:16px;padding:16px;color:#fff;border:1px solid #222"><div style="text-align:center;padding:10px"><div style="font-size:40px">🔒</div><div style="font-weight:800;margin-top:6px">القسم الخاص</div><div style="font-size:11px;color:#666;margin-top:4px">ادخل الرقم التعريفي</div></div><input id="hPass" type="password" inputmode="numeric" placeholder="••••" style="width:100%;background:#1A1A1A;border:1px solid #2A2A2A;padding:13px;border-radius:11px;color:#fff;text-align:center;margin-top:12px;font-size:20px;letter-spacing:5px"><button onclick="unlockHidden()" style="width:100%;margin-top:10px;background:#fff;color:#000;border:none;padding:12px;border-radius:11px;font-weight:800">فتح 🔓</button><div id="hErr" style="color:#ff5a5a;font-size:11px;text-align:center;margin-top:8px;display:none"></div></div>
<div id="hiddenContent" style="display:none"><div style="background:#0F0F0F;border-radius:16px;padding:12px;border:1px solid #222"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px"><b style="font-size:13px;color:#fff">📓 الخاص</b><div style="display:flex;gap:6px"><button onclick="openChangePassword()" style="background:#1A1A1A;border:1px solid #333;color:#aaa;padding:7px 10px;border-radius:8px;font-size:11px">🔑 تغيير</button><button onclick="openHiddenEditor()" style="background:#fff;color:#000;border:none;padding:7px 12px;border-radius:8px;font-weight:800;font-size:11px">+ نوت</button><button onclick="hideHiddenTab()" style="background:#1A1A1A;border:1px solid #2A2A2A;color:#fff;padding:7px 10px;border-radius:8px;font-size:11px">إخفاء</button></div></div><div id="hiddenEditorBox" style="display:none;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:12px;padding:10px;margin-bottom:10px"><div class="rich-toolbar" style="background:#222"><button onclick="formatHidden('bold')"><b>B</b></button><div class="dot" style="background:#ef4444" onclick="applyHiddenColor('#ef4444')"></div><div class="dot" style="background:#22c55e" onclick="applyHiddenColor('#22c55e')"></div><div class="dot" style="background:#3b82f6" onclick="applyHiddenColor('#3b82f6')"></div><div class="dot" style="background:#f59e0b" onclick="applyHiddenColor('#f59e0b')"></div><div class="dot" style="background:#fff" onclick="applyHiddenColor('#ffffff')"></div></div><input id="hiddenTitle" placeholder="عنوان..." style="width:100%;background:#111;border:1px solid #333;padding:10px;border-radius:8px;color:#fff;margin-bottom:8px"><div id="hiddenBody" class="rich-editor" contenteditable="true" style="background:#111;color:#fff;border-color:#333;min-height:20vh"></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="saveHiddenRich()" style="flex:1;background:#fff;color:#000;border:none;padding:10px;border-radius:8px;font-weight:800">حفظ</button><button onclick="closeHiddenEditor()" style="flex:1;background:#222;color:#fff;border:1px solid #333;padding:10px;border-radius:8px">إلغاء</button></div></div><input id="hSearch" placeholder="بحث..." oninput="renderHidden()" style="width:100%;background:#1A1A1A;border:1px solid #2A2A2A;padding:9px 12px;border-radius:9px;color:#fff;font-size:12px;margin-bottom:10px"><div id="hList" style="max-height:52vh;overflow:auto" class="nu-scroll"></div></div></div>
</div>
</div>
<div style="padding:10px 12px;border-top:1px solid #F2EFEA;display:flex;gap:8px;flex-shrink:0;background:#fff"><button onclick="deleteCurrent()" style="background:#FFF1F2;color:#ef4444;border:1.5px solid #FECDD3;padding:11px 14px;border-radius:10px;flex:1;font-weight:800;cursor:pointer">🗑 حذف</button><button onclick="toggleDone()" id="doneBtn" style="background:#111;color:#fff;border:none;padding:11px 14px;border-radius:10px;font-weight:800;flex:2;cursor:pointer">تم ✓</button></div>
</div>

<script>
function loadOldTasks(){let old=JSON.parse(localStorage.getItem('tasks_v6')||'null');if(!old||old.length===0){old=JSON.parse(localStorage.getItem('tasks_v5')||localStorage.getItem('tasks')||'[]');}return old;}
function fmt(n){if(n===''||n==null)return'';let x=typeof n==='string'?parseFloat(n.toString().replace(/,/g,'')):n;if(isNaN(x))return n;return x.toLocaleString('en-US')}
function formatTextNumbers(t){return (t||'').replace(/\b\d{4,}\b/g,m=>fmt(m))}

function getSecretCode(){
  try{
    const v=localStorage.getItem('__my_secret_num__');
    if(!v) return '279'; // الرقم الافتراضي لو انت لسه ما غيرتش
    return atob(v);
  }catch{return '279'}
}
function doAdd(){
  const inp=document.getElementById('mainInput');
  const val=inp.value.trim();
  if(!val) return;
  const secret=getSecretCode();
  // لو كتب الرقم السري بالظبط - افتح الخاص وما تضيفش مهمة
  if(val===secret){ inp.value=''; boardSearch=''; revealHiddenTab(); return; }
  tasks.unshift({id:Date.now(),text:val,cat:document.getElementById('cat').value||cats[0].name,color:selectedHex||'#ffffff',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null});
  inp.value=''; boardSearch=''; save();
}
document.getElementById('mainInput').addEventListener('input',e=>{
  const v=e.target.value.trim();
  const secret=getSecretCode();
  if(v===secret){ revealHiddenTab(); return; }
  boardSearch=v.toLowerCase(); render();
});
document.getElementById('mainInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAdd()});
document.getElementById('subInput').addEventListener('keydown',e=>{if(e.key==='Enter')addSub()});

let hKey=null,hNotes=[];const H_CFG='__sys_pref_cache__',H_DATA='__sys_pref_data__';
async function deriveKey(p,s){const e=new TextEncoder();const km=await crypto.subtle.importKey('raw',e.encode(p),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function hEnc(d,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(d)));return{iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))}}
async function hDec(o,k){try{const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(o.iv)},k,new Uint8Array(o.ct));return JSON.parse(new TextDecoder().decode(dec))}catch{return null}}
function revealHiddenTab(){const btn=document.getElementById('tHidden');btn.style.display='block';btn.animate([{transform:'scale(0)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:300});if(document.getElementById('modal').style.display==='none'){if(tasks[0])openCard(tasks[0].id);else{tasks.unshift({id:Date.now(),text:'مهمة',cat:cats[0].name,color:'#fff',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null});save();openCard(tasks[0].id)}}setTimeout(()=>tab('hidden'),350);}
function hideHiddenTab(){ lockHidden(); document.getElementById('tHidden').style.display='none'; tab('note'); }
function lockHidden(){hKey=null;const auth=document.getElementById('hiddenAuth');const content=document.getElementById('hiddenContent');if(auth) auth.style.display='block'; if(content) content.style.display='none';const pass=document.getElementById('hPass'); if(pass) pass.value=''; const err=document.getElementById('hErr'); if(err) err.style.display='none';}
async function unlockHidden(){
  const pass=document.getElementById('hPass').value.trim();if(pass.length<2){document.getElementById('hErr').style.display='block';document.getElementById('hErr').innerText='قصير';return}
  const cfg=JSON.parse(localStorage.getItem(H_CFG)||'null');
  try{
    if(!cfg){const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(pass,salt);const enc=await hEnc([],key);localStorage.setItem(H_CFG,JSON.stringify({salt:Array.from(salt)}));localStorage.setItem(H_DATA,JSON.stringify(enc));hKey=key;hNotes=[];}
    else{const key=await deriveKey(pass,new Uint8Array(cfg.salt));const dataObj=JSON.parse(localStorage.getItem(H_DATA)||'null');let dec=null;if(dataObj)dec=await hDec(dataObj,key);if(dataObj&&dec===null)throw new Error('wrong');hKey=key;hNotes=dec||[];}
    document.getElementById('hiddenAuth').style.display='none';document.getElementById('hiddenContent').style.display='block';renderHidden();
  }catch(e){const er=document.getElementById('hErr');er.style.display='block';er.innerText='رقم غلط!';}
}
async function saveHiddenData(){if(!hKey)return;const enc=await hEnc(hNotes,hKey);localStorage.setItem(H_DATA,JSON.stringify(enc))}
function renderHidden(){const q=(document.getElementById('hSearch').value||'').toLowerCase();const list=document.getElementById('hList');const f=hNotes.filter(n=>!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);if(!f.length){list.innerHTML=`<div style="text-align:center;padding:20px;color:#555;font-size:12px">مفيش نوتس</div>`;return}list.innerHTML=f.map(n=>`<div class="hidden-note"><div style="display:flex;justify-content:space-between"><b>${n.title.replace(/</g,'&lt;')}</b><div style="display:flex;gap:6px"><button onclick="editHidden(${n.id})" style="background:#222;border:none;color:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer">✏️</button><button onclick="delHidden(${n.id})" style="background:#3a1515;border:none;color:#ff6b6b;width:24px;height:24px;border-radius:6px;cursor:pointer">✕</button></div></div><div style="font-size:12px;color:#ccc;margin-top:6px;">${n.body}</div></div>`).join('');}
let editingHiddenId=null;
function openHiddenEditor(){editingHiddenId=null;document.getElementById('hiddenTitle').value='';document.getElementById('hiddenBody').innerHTML='';currentHiddenColor='#ffffff';document.getElementById('hiddenEditorBox').style.display='block';}
function closeHiddenEditor(){document.getElementById('hiddenEditorBox').style.display='none';}
function saveHiddenRich(){const title=document.getElementById('hiddenTitle').value.trim()||'بدون عنوان';const body=document.getElementById('hiddenBody').innerHTML.trim();if(!body)return;if(editingHiddenId){const n=hNotes.find(x=>x.id===editingHiddenId);if(n){n.title=title;n.body=body;}}else{hNotes.unshift({id:Date.now(),title,body});}saveHiddenData();renderHidden();closeHiddenEditor();editingHiddenId=null;}
function editHidden(id){const n=hNotes.find(x=>x.id===id);if(!n)return;editingHiddenId=id;document.getElementById('hiddenTitle').value=n.title;document.getElementById('hiddenBody').innerHTML=n.body;document.getElementById('hiddenEditorBox').style.display='block';}
function delHidden(id){if(!confirm('تحذف؟'))return;hNotes=hNotes.filter(x=>x.id!==id);saveHiddenData();renderHidden()}
async function openChangePassword(){
  const newPass=prompt('الرقم الجديد (رقمين على الأقل):');
  if(!newPass || newPass.length<2){ alert('قصير'); return; }
  const confirmPass=prompt('أكد الرقم الجديد:');
  if(newPass!==confirmPass){ alert('مش زي بعض'); return; }
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const newKey=await deriveKey(newPass,salt);
    const enc=await hEnc(hNotes,newKey);
    localStorage.setItem(H_CFG,JSON.stringify({salt:Array.from(salt)}));
    localStorage.setItem(H_DATA,JSON.stringify(enc));
    localStorage.setItem('__my_secret_num__',btoa(newPass));
    hKey=newKey;
    alert(`✅ تم تغيير الرقم لـ ${newPass}`);
  }catch(err){ alert('فشل'); }
}
let pressTimer=null;
const vaultEl=document.getElementById('vaultTrigger');
vaultEl.addEventListener('mousedown',()=>{pressTimer=setTimeout(openSecretModal,2500)});
vaultEl.addEventListener('mouseup',()=>clearTimeout(pressTimer));
vaultEl.addEventListener('mouseleave',()=>clearTimeout(pressTimer));
vaultEl.addEventListener('touchstart',()=>{pressTimer=setTimeout(openSecretModal,2500)},{passive:true});
vaultEl.addEventListener('touchend',()=>clearTimeout(pressTimer));
</script>
