<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;font-family:'IBM Plex Sans Arabic',sans-serif}
body{margin:0;background:#e5e7eb;display:flex;justify-content:center;min-height:100vh;padding:12px}
.phone{width:390px;max-width:100%;background:#fff;border:8px solid #111;border-radius:28px;overflow:hidden;position:relative;min-height:85vh;display:flex;flex-direction:column}
.pageWrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;width:100%;border:none;display:none}
.page.active{display:block}
.bottom-nav{display:flex;justify-content:space-around;padding:8px 0;background:#fff;border-top:1px solid #f0f0f0}
.nav-item{flex:1;text-align:center;font-size:8px;color:#9aa0aa;cursor:pointer}
.nav-item.active{color:#111;font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="pageWrap">
    <iframe data-page="home.html" src="home.html" class="page active"></iframe>
    <iframe data-page="daily.html" src="about:blank" data-src="daily.html" class="page"></iframe>
    <iframe data-page="attendance.html" src="about:blank" data-src="attendance.html" class="page"></iframe>
    <iframe data-page="tasks.html" src="about:blank" data-src="tasks.html" class="page"></iframe>
  </div>
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('home.html')">🏠<br>الرئيسية</div>
    <div class="nav-item" onclick="showPage('daily.html')">📅<br>اليومية</div>
    <div class="nav-item" onclick="showPage('attendance.html')">⏱️<br>الحضور</div>
    <div class="nav-item" onclick="showPage('tasks.html')">📝<br>المهام</div>
  </div>
</div>
<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>{
    if(p.dataset.page===name){
      if(p.src==='about:blank' && p.dataset.src) p.src=p.dataset.src;
      p.classList.add('active');
    }else p.classList.remove('active');
  });
  document.querySelectorAll('.nav-item').forEach((n,i)=>{
    n.classList.toggle('active', n.textContent.includes(name==='home.html'?'الرئيسية':name==='daily.html'?'اليومية':name==='attendance.html'?'الحضور':'المهام'));
  });
}
</script>
</body>
</html>
