<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow">
      <h1 class="text-xl font-bold">My Project</h1>
    </header>
    <nav class="grid grid-cols-2 gap-4 p-4">
      <a href="home.html" class="bg-white p-6 rounded-2xl shadow text-center font-bold">🏠 الرئيسية</a>
      <a href="attendance.html" class="bg-white p-6 rounded-2xl shadow text-center font-bold">📅 الحضور</a>
      <a href="daily.html" class="bg-white p-6 rounded-2xl shadow text-center font-bold">📝 اليومية</a>
      <a href="tasks.html" class="bg-white p-6 rounded-2xl shadow text-center font-bold">✅ المهام</a>
    </nav>
    <div class="p-4 mt-auto">
      <button id="installBtn" class="hidden w-full bg-blue-600 text-white p-4 rounded-xl font-bold">تثبيت التطبيق من كروم</button>
    </div>
  </div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(outcome);
    deferredPrompt = null;
  }
});
</script>
</body>
</html>
