<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968705.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:#FBF9F6;height:100dvh;overflow:hidden;position:relative}
.pageWrap{position:absolute;top:0;left:0;right:0;bottom:68px;overflow:hidden}
.page{position:absolute;top:0;left:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transform:translateX(10px);transition:.18s}
.page.active{opacity:1;pointer-events:auto;transform:translateX(0);z-index:2}
.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #F2EFEA;display:flex;align-items:center;z-index:100}
.nav button{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:#9aa0aa;font-size:10px;font-weight:700;cursor:pointer}
.nav button span:first-child{font-size:20px}
.nav button.active{color:#111;background:#F5F5F4}
#installBtn{display:none;position:fixed;top:12px;left:12px;z-index:999;background:#111;color:#fff;border:none;padding:10px 16px;border-radius:999px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<button id="installBtn">📲 تثبيت التطبيق APK</button>
<div class="pageWrap">
  <iframe data-page="home.html" src="home.html" class="page active"></iframe>
  <iframe data-page="daily.html" src="about:blank" class="page"></iframe>
  <iframe data-page="attendance.html" src="about:blank" class="page"></iframe>
  <iframe data-page="tasks.html" src="about:blank" class="page"></iframe>
</div>
<nav class="nav">
  <button class="active" onclick="switchPage('home.html',this)"><span>🏠</span><span>الرئيسية</span></button>
  <button onclick="switchPage('daily.html',this)"><span>📅</span><span>اليومية</span></button>
  <button onclick="switchPage('attendance.html',this)"><span>⏱️</span><span>الحضور</span></button>
  <button onclick="switchPage('tasks.html',this)"><span>📝</span><span>المهام</span></button>
</nav>
<script>
const frames=document.querySelectorAll('.page');
function switchPage(name,btn){
  frames.forEach(f=>{
    const isTarget=f.dataset.page===name;
    f.classList.toggle('active',isTarget);
    if(isTarget && f.src.includes('about:blank')) f.src=name;
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
window.addEventListener('load',()=>{
  setTimeout(()=>{document.querySelector('[data-page="daily.html"]').src='daily.html'},800);
  setTimeout(()=>{document.querySelector('[data-page="attendance.html"]').src='attendance.html'},1600);
  setTimeout(()=>{document.querySelector('[data-page="tasks.html"]').src='tasks.html'},2400);
});
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;installBtn.style.display='block';
});
installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted') installBtn.style.display='none';
  deferredPrompt=null;
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
